name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - run: mkdir -p dist && npm run package

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: localias.vsix
          path: dist/*.vsix
          retention-days: 30
